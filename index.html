<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPortal | Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
    linear-gradient(rgba(0,32,96,.72),rgba(0,82,160,.72)),
    url("https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&w=1800&q=80");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

body::before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    background:#00c6ff;
    border-radius:50%;
    filter:blur(170px);
    top:-120px;
    left:-120px;
    opacity:.35;
}

body::after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    background:#00ff95;
    border-radius:50%;
    filter:blur(170px);
    bottom:-120px;
    right:-120px;
    opacity:.28;
}

.card{
    width:430px;
    padding:42px;
    text-align:center;
    color:#fff;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    animation:slideUp 1s ease;
}

.logo{
    font-size:60px;
}

h1{
    margin-top:10px;
    font-size:36px;
    letter-spacing:1px;
}

.tagline{
    margin-top:8px;
    color:#dff4ff;
    font-size:16px;
}

.welcome{
    margin:25px 0;
    color:#fff;
    line-height:1.7;
    font-size:15px;
}

.btn{
    display:block;
    width:100%;
    padding:16px;
    margin-top:16px;
    border-radius:14px;
    text-decoration:none;
    color:#fff;
    font-size:17px;
    font-weight:600;
    transition:.35s;
}

.student{
    background:linear-gradient(90deg,#007bff,#00b4ff);
}

.student:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(0,123,255,.5);
}

.admin{
    background:linear-gradient(90deg,#00b894,#00e676);
}

.admin:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(0,230,118,.45);
}

.footer{
    margin-top:28px;
    font-size:13px;
    color:#d8e9ff;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🎓</div>

<h1>EduPortal</h1>

<p class="tagline">
Student Management & Academic Portal
</p>

<p class="welcome">
<b>Welcome to EduPortal!</b><br>
Empowering Education, Inspiring Success.<br>
Access your academic journey securely through one modern platform.
</p>

<a href="student-login.html" class="btn student">
👨‍🎓 Login as Student
</a>

<a href="admin-login.html" class="btn admin">
👨‍💼 Login as Admin
</a>

<div class="footer">
© 2026 EduPortal • Excellence Through Education
</div>

</div>

</body>
</html>
