<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | EduPortal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:
    linear-gradient(rgba(0,40,120,.75),rgba(0,80,170,.75)),
    url("https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&w=1800&q=80");
    background-size:cover;
    background-position:center;
}

.container{
    width:420px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:35px;
    color:#fff;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    text-align:center;
    margin-top:10px;
    font-size:32px;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    color:#eee;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.password-box{
    position:relative;
}

.password-box span{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#444;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    color:#fff;
    text-decoration:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0066ff;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#004dcc;
}

.links{
    margin-top:25px;
    text-align:center;
}

.links a{
    color:#fff;
    text-decoration:none;
    display:block;
    margin-top:12px;
    font-weight:600;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">🎓</div>

<h1>EduPortal</h1>

<p class="subtitle">
Student Login
</p>

<form id="loginForm">

<div class="input-box">
<input
type="text"
placeholder="Admission Number"
required>
</div>

<div class="input-box password-box">

<input
type="password"
id="password"
placeholder="Password"
required>

<span onclick="togglePassword()">👁</span>

</div>

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="forgot.html">
Forgot Password?
</a>

</div>

<button type="submit">
🔐 Login
</button>

</form>

<div class="links">

<a href="register.html">
Create Student Account
</a>

<a href="index.html">
← Back to Home
</a>

</div>

</div>

<script>

function togglePassword(){

const password=document.getElementById("password");

password.type=password.type==="password"?"text":"password";

}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

/* Backend authentication goes here.
   If account is approved and credentials are correct,
   redirect to dashboard. */

window.location.href="dashboard.html";

});

</script>

</body>
  </html>
